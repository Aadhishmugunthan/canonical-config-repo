eventName: SETTLEMENT
description: Settlement Service transactions

tables:

  # ===== TABLE 1: SEND_TRANSACTIONS (Main Table) =====
  - tableName: SEND_TRANSACTIONS
    order: 1
    type: main
    mandatory:
      - TRAN_ID
      - TRAN_TYPE
    mapping:
      TRAN_ID: $.settlementTransactionId
      TRAN_TYPE: $.transactionType

      TRAN_INIT_ID: $.referenceId

      ORIG_INST_ID: $.partnerId
      ORIG_INST_NAM: $.partnerName

      TRANFR_ACPT_NAM: $.institution
      TRANFR_ACPT_ID: $.partnerId

      TRAN_CRTE_DT: $.settlementLocalDateTime

      CUR_STAT: $.settlementStatus
      ORIG_STAT: $.previousStatus

      CUST_REF_NUM: $.referenceId
      USE_CASE: $.settlementMethod
      MSG_TYPE: $.network
      REF_ID: $.referenceId

      SW_SER_NUM: $.switchSerialNumber
      BNKINT_REF_NUM: $.correlationId

      SEND_ACCT: $.debtorAccountUri
      RECIP_ACCT: $.creditorAccountUri

      TRAN_AMT: $.settlementAmount.value
      TRAN_CURR: $.settlementAmount.currency

      ERR_CD: $.settlementStatusCode
      ERR_CD_DESC: $.settlementStatusDescription

      FUND_AVAIL: $.fundAvailability

      CORLTN_ID: $.correlationId

      CRTE_TS: $.settlementLocalDateTime
      CRTE_USER_NAM: $.partnerName
      UPDT_TS: $.settlementLocalDateTime
      UPDT_USER_NAM: $.partnerName
      RPLCTN_UPDT_TS: $.settlementLocalDateTime

      NTWRK_CD: $.network
      NTWRK_RESP_CD: $.brand
      NTWRK_RESP_CD_DESC: $.acceptanceBrand

      TRAN_INIT_NAM: $.partnerName

      NAM_STAT: $.settlementStatus
      CVC_STAT: $.settlementStatus
      CVC_RESP_CD: $.settlementStatusCode

      ACCT_NUM: $.debtorAccountUri
      ACCT_TYPE: $.settlementMethod
      ACCT_HOLD_NAM: $.institution

      NON_FIN_TXN: $.transactionType


  # ===== TABLE 2: SEND_TRAN_DTL =====
  - tableName: SEND_TRAN_DTL
    order: 2
    type: detail
    parentIdField: TRAN_ID
    mandatory:
      - TRAN_ID
    mapping:
      TRAN_ID: $.settlementTransactionId
      TRAN_CRTE_DT: $.settlementLocalDateTime

      PAYMT_REF: $.referenceId
      UNQ_TRAN_REF: $.correlationId

      FUND_SRC: $.partnerName
      TRAN_PRPS: $.settlementPurpose

      ORIG_RQST_PYLD: $.originalRequestPayload
      ORIG_RESP_PYLD: $.originalResponsePayload

      PROC_ID: $.partnerId

      ACQ_ICA: $.brand
      ACQ_IDEN_CD: $.acceptanceBrand
      ACQ_CNTRY_NAM: $.country

      PAYMT_TYPE: $.transactionType
      POINT_SERV_INTRCTN: $.network

      TRAN_SETL_AMT: $.settlementAmount.value

      BNC_GTWY_RQST: $.originalRequestPayload
      BNC_GTWY_RESP: $.originalResponsePayload

      TRANFR_ACPT_ID: $.partnerId
      TRANFR_ACPT_NAM: $.institution

      TRANFR_ACPT_MPG_ID: $.partnerId
      TRANFR_ACPT_MERCH_VALUE: $.institution

      CRDTYCD: $.settlementMethod
      POSPERAT: $.network
      CRDTYCDDES: $.settlementMethod

      ICHG_RATE_DSGN: $.brand
      MERCH_CAT_CD: $.transactionType

      MC_ASSGN_MERCH: $.institution
      PAYMT_FACILTR_ID: $.partnerId
      SUB_MERCH_ID: $.partnerId

      TRANFR_TRML_ID: $.partnerId

      TRANFR_ACPT_ST_LINE1: $.institution
      TRANFR_ACPT_ST_LINE2: $.institution

      TRANFR_ACPT_CITY: $.country
      TRANFR_ACPT_ST: $.country
      TRANFR_ACPT_CNTRY_NAM: $.country
      TRANFR_ACPT_POST_CD: $.settlementAmount.currency

      CRTE_TS: $.settlementLocalDateTime
      CRTE_USER_NAM: $.partnerName
      UPDT_TS: $.settlementLocalDateTime
      UPDT_USER_NAM: $.partnerName

      EVENT_ID: $.correlationId
      EVENT_TS: $.settlementLocalDateTime
      EVENT_CORLTN_ID: $.correlationId

      MSG_VERSION: $.network

      TRAN_TYPE_IND_CD: $.transactionType
      REGULATED_RATE_TYPE_CD: $.brand

      CVC_RESP_DESC: $.settlementStatusDescription

      RPLCTN_UPDT_TS: $.settlementLocalDateTime


  # ===== TABLE 3: SEND_RECIP_DTL =====
  - tableName: SEND_RECIP_DTL
    order: 3
    type: recipient
    parentIdField: TRAN_ID
    autoGenerateId: true
    mandatory:
      - TRAN_ID
    mapping:
      TRAN_ID: $.settlementTransactionId
      TRAN_CRTE_DT: $.settlementLocalDateTime

      SEND_FIRST_NAM: $.debtor.firstName
      SEND_MID_NAM: $.debtor.firstName
      SEND_LST_NAM: $.debtor.lastName

      SEND_PHN: $.debtor.phone
      SEND_EMAIL: $.debtor.email
      SEND_DOB: $.debtor.dateOfBirth
      SEND_NATL: $.debtor.address.country
      SEND_BIRTH_CNTRY_NAM: $.debtor.address.country

      SEND_ACCT_NUM: $.debtorAccountUri
      SEND_ACCT_URI: $.debtorAccountUri
      SEND_GOVT_ID_URI: $.debtorAccountUri
      SEND_ACCT_NUM_TYPE: $.settlementMethod

      SEND_CARD_NUM: $.debtorAccountUri
      SEND_CARD_EXPIR_DT: $.cardExpiry

      SEND_ST_LINE1: $.debtor.address.line1
      SEND_ST_LINE2: $.debtor.address.line2
      SEND_CITY: $.debtor.address.city
      SEND_ST: $.debtor.address.state
      SEND_CNTRY_NAM: $.debtor.address.country
      SEND_POST_CD: $.debtor.address.postalCode


  # ===== TABLE 4: SEND_TRAN_ADDR_DTL =====
  - tableName: SEND_TRAN_ADDR_DTL
    order: 4
    type: address
    parentIdField: TRAN_ID
    autoGenerateId: true
    addressTypes:

      - type: INSTITUTION
        rootPath: $
        fields:
          TRAN_ID: $.settlementTransactionId
          ST_LINE1: $.institution
          ST_LINE2: $.institution
          CITY: $.country
          ST: $.country
          CNTRY_NAM: $.country
          POST_CD: $.settlementAmount.currency

          CRTE_TS: $.settlementLocalDateTime
          UPDT_TS: $.settlementLocalDateTime
          CRTE_USER_NAM: $.partnerName
          UPDT_USER_NAM: $.partnerName
          RPLCTN_UPDT_TS: $.settlementLocalDateTime


  # ===== TABLE 5: SETTLEMENT =====
  - tableName: SETTLEMENT
    order: 5
    type: child
    parentIdField: TRAN_ID
    rootPath: $
    mandatory:
      - TRAN_ID
    mapping:
      TRAN_ID: $.settlementTransactionId

      SETL_STAT: $.settlementStatus
      SETL_DT: $.settlementDate
      SETL_TM: $.settlementTime

      SETL_AMT: $.settlementAmount.value
      SETL_CURR: $.settlementAmount.currency

      SETL_REF_ID: $.settlementReference
      SETL_BATCH_ID: $.batchId

      SETL_METHOD: $.settlementMethod
      SETL_CHANNEL: $.settlementChannel

      CRTE_TS: $.settlementLocalDateTime
      CRTE_USER_NAM: $.partnerName
      UPDT_TS: $.settlementLocalDateTime
      UPDT_USER_NAM: $.partnerName
      RPLCTN_UPDT_TS: $.settlementLocalDateTime
