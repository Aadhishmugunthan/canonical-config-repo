eventName: CLEARING
description: Clearing Service transactions

tables:

  # ===== TABLE 1: SEND_TRANSACTIONS (Main Table) =====
  - tableName: SEND_TRANSACTIONS
    order: 1
    type: main
    mandatory:
      - TRAN_ID
      - TRAN_TYPE
    mapping:
      TRAN_ID: $.clearingId
      TRAN_TYPE: $.transactionType

      TRAN_INIT_ID: $.referenceId

      ORIG_INST_ID: $.partnerId
      ORIG_INST_NAM: $.partnerName

      TRANFR_ACPT_NAM: $.institution
      TRANFR_ACPT_ID: $.partnerId

      TRAN_CRTE_DT: $.transactionLocalDateTime

      CUR_STAT: $.clearingStatus.responseReasonCode
      ORIG_STAT: $.clearingStatus.eligible

      CUST_REF_NUM: $.referenceId
      USE_CASE: $.paymentMethod
      MSG_TYPE: $.network
      REF_ID: $.referenceId

      SW_SER_NUM: $.switchSerialNumber
      BNKINT_REF_NUM: $.correlationId

      SEND_ACCT: $.cardAccountNumber
      RECIP_ACCT: $.merchantId

      TRAN_AMT: $.clearingAmount.value
      TRAN_CURR: $.clearingAmount.currency

      ERR_CD: $.clearingStatus.responseReasonCode
      ERR_CD_DESC: $.clearingStatus.responseReasonDetail

      FUND_AVAIL: $.clearingStatus.eligible

      CORLTN_ID: $.correlationId

      CRTE_TS: $.transactionLocalDateTime
      CRTE_USER_NAM: $.partnerName
      UPDT_TS: $.transactionLocalDateTime
      UPDT_USER_NAM: $.partnerName
      RPLCTN_UPDT_TS: $.transactionLocalDateTime

      NTWRK_CD: $.network
      NTWRK_RESP_CD: $.brand
      NTWRK_RESP_CD_DESC: $.acceptanceBrand

      TRAN_INIT_NAM: $.partnerName

      NAM_STAT: $.clearingStatus.eligible
      CVC_STAT: $.clearingStatus.eligible
      CVC_RESP_CD: $.clearingStatus.responseReasonCode

      ACCT_NUM: $.cardAccountNumber
      ACCT_TYPE: $.paymentMethod
      ACCT_HOLD_NAM: $.institution

      NON_FIN_TXN: $.transactionType

  # ===== TABLE 2: SEND_TRAN_DTL (Detail Table) =====
  - tableName: SEND_TRAN_DTL
    order: 2
    type: detail
    parentIdField: TRAN_ID
    mandatory:
      - TRAN_ID
    mapping:
      TRAN_ID: $.clearingId
      TRAN_CRTE_DT: $.transactionLocalDateTime

      PAYMT_REF: $.referenceId
      UNQ_TRAN_REF: $.correlationId

      FUND_SRC: $.partnerName
      TRAN_PRPS: $.paymentPurpose

      ORIG_RQST_PYLD: $.originalRequestPayload
      ORIG_RESP_PYLD: $.originalResponsePayload

      PROC_ID: $.partnerId

      ACQ_ICA: $.brand
      ACQ_IDEN_CD: $.acceptanceBrand
      ACQ_CNTRY_NAM: $.country

      PAYMT_TYPE: $.transactionType
      POINT_SERV_INTRCTN: $.network

      TRAN_SETL_AMT: $.clearingAmount.value

      BNC_GTWY_RQST: $.originalRequestPayload
      BNC_GTWY_RESP: $.originalResponsePayload

      TRANFR_ACPT_ID: $.partnerId
      TRANFR_ACPT_NAM: $.institution

      TRANFR_ACPT_MPG_ID: $.partnerId
      TRANFR_ACPT_MERCH_VALUE: $.institution

      CRDTYCD: $.cardTypeCode
      POSPERAT: $.posEntryMode
      CRDTYCDDES: $.cardTypeDescription

      ICHG_RATE_DSGN: $.brand
      MERCH_CAT_CD: $.transactionType

      MC_ASSGN_MERCH: $.institution
      PAYMT_FACILTR_ID: $.partnerId
      SUB_MERCH_ID: $.partnerId

      TRANFR_TRML_ID: $.partnerId

      TRANFR_ACPT_ST_LINE1: $.merchant.address.line1
      TRANFR_ACPT_ST_LINE2: $.merchant.address.line2

      TRANFR_ACPT_CITY: $.merchant.address.city
      TRANFR_ACPT_ST: $.merchant.address.state
      TRANFR_ACPT_CNTRY_NAM: $.merchant.address.country
      TRANFR_ACPT_POST_CD: $.merchant.address.postalCode

      CRTE_TS: $.transactionLocalDateTime
      CRTE_USER_NAM: $.partnerName
      UPDT_TS: $.transactionLocalDateTime
      UPDT_USER_NAM: $.partnerName

      EVENT_ID: $.correlationId
      EVENT_TS: $.transactionLocalDateTime
      EVENT_CORLTN_ID: $.correlationId

      MSG_VERSION: $.network

      TRAN_TYPE_IND_CD: $.transactionType
      REGULATED_RATE_TYPE_CD: $.brand

      CVC_RESP_DESC: $.clearingStatus.responseReasonDetail

      RPLCTN_UPDT_TS: $.transactionLocalDateTime

  # ===== TABLE 3: SEND_RECIP_DTL (Recipient Table) =====
  - tableName: SEND_RECIP_DTL
    order: 3
    type: recipient
    parentIdField: TRAN_ID
    autoGenerateId: true
    mandatory:
      - TRAN_ID
    mapping:
      TRAN_ID: $.clearingId
      TRAN_CRTE_DT: $.transactionLocalDateTime

      SEND_FIRST_NAM: $.cardHolder.firstName
      SEND_MID_NAM: $.cardHolder.firstName
      SEND_LST_NAM: $.cardHolder.lastName

      SEND_PHN: $.cardHolder.phone
      SEND_EMAIL: $.cardHolder.email
      SEND_DOB: $.cardHolder.dateOfBirth
      SEND_NATL: $.cardHolder.address.country
      SEND_BIRTH_CNTRY_NAM: $.cardHolder.address.country

      SEND_ACCT_NUM: $.cardAccountNumber
      SEND_ACCT_URI: $.cardAccountNumber
      SEND_GOVT_ID_URI: $.cardAccountNumber
      SEND_ACCT_NUM_TYPE: $.paymentMethod

      SEND_CARD_NUM: $.cardAccountNumber
      SEND_CARD_EXPIR_DT: $.cardExpiry

      SEND_ST_LINE1: $.cardHolder.address.line1
      SEND_ST_LINE2: $.cardHolder.address.line2
      SEND_CITY: $.cardHolder.address.city
      SEND_ST: $.cardHolder.address.state
      SEND_CNTRY_NAM: $.cardHolder.address.country
      SEND_POST_CD: $.cardHolder.address.postalCode

      RECIP_FIRST_NAM: $.merchant.name
      RECIP_MID_NAM: $.merchant.name
      RECIP_LST_NAM: $.merchant.category

      RECIP_PHN: $.merchant.phone
      RECIP_EMAIL: $.merchant.email
      RECIP_DOB: $.transactionLocalDateTime
      RECIP_NATL: $.merchant.address.country
      RECIP_BIRTH_CNTRY_NAM: $.merchant.address.country

      RECIP_ACCT_NUM: $.merchantId
      RECIP_ACCT_URI: $.merchantId
      RECIP_GOVT_ID_URI: $.merchantId
      RECIP_ACCT_NUM_TYPE: $.paymentMethod

      RECIP_CARD_NUM: $.merchantId
      RECIP_CARD_EXPIR_DT: $.cardExpiry

      RECIP_ST_LINE1: $.merchant.address.line1
      RECIP_ST_LINE2: $.merchant.address.line2
      RECIP_CITY: $.merchant.address.city
      RECIP_ST: $.merchant.address.state
      RECIP_CNTRY_NAM: $.merchant.address.country
      RECIP_POST_CD: $.merchant.address.postalCode

      CRTE_TS: $.transactionLocalDateTime
      CRTE_USER_NAM: $.partnerName
      UPDT_TS: $.transactionLocalDateTime
      UPDT_USER_NAM: $.partnerName
      RPLCTN_UPDT_TS: $.transactionLocalDateTime

      PARTY_ROLE: $.transactionType

  # ===== TABLE 4: SEND_TRAN_ADDR_DTL (Address Table) =====
  - tableName: SEND_TRAN_ADDR_DTL
    order: 4
    type: address
    parentIdField: TRAN_ID
    autoGenerateId: true
    addressTypes:

      - type: INSTITUTION
        rootPath: $
        fields:
          TRAN_ID: $.clearingId
          ST_LINE1: $.institution
          ST_LINE2: $.institution
          CITY: $.country
          ST: $.country
          CNTRY_NAM: $.country
          POST_CD: $.clearingAmount.currency
          ADDR_STAT: $.paymentMethod
          POST_CD_STAT: $.paymentMethod
          CRTE_TS: $.transactionLocalDateTime
          UPDT_TS: $.transactionLocalDateTime
          CRTE_USER_NAM: $.partnerName
          UPDT_USER_NAM: $.partnerName
          RPLCTN_UPDT_TS: $.transactionLocalDateTime

      - type: CARDHOLDER
        rootPath: $
        fields:
          TRAN_ID: $.clearingId
          ST_LINE1: $.cardHolder.address.line1
          ST_LINE2: $.cardHolder.address.line2
          CITY: $.cardHolder.address.city
          ST: $.cardHolder.address.state
          CNTRY_NAM: $.cardHolder.address.country
          POST_CD: $.cardHolder.address.postalCode
          ADDR_STAT: $.clearingStatus.eligible
          POST_CD_STAT: $.paymentMethod
          CRTE_TS: $.transactionLocalDateTime
          UPDT_TS: $.transactionLocalDateTime
          CRTE_USER_NAM: $.partnerName
          UPDT_USER_NAM: $.partnerName
          RPLCTN_UPDT_TS: $.transactionLocalDateTime

      - type: MERCHANT
        rootPath: $
        fields:
          TRAN_ID: $.clearingId
          ST_LINE1: $.merchant.address.line1
          ST_LINE2: $.merchant.address.line2
          CITY: $.merchant.address.city
          ST: $.merchant.address.state
          CNTRY_NAM: $.merchant.address.country
          POST_CD: $.merchant.address.postalCode
          ADDR_STAT: $.clearingStatus.responseReasonCode
          POST_CD_STAT: $.paymentMethod
          CRTE_TS: $.transactionLocalDateTime
          UPDT_TS: $.transactionLocalDateTime
          CRTE_USER_NAM: $.partnerName
          UPDT_USER_NAM: $.partnerName
          RPLCTN_UPDT_TS: $.transactionLocalDateTime

  # ===== TABLE 5: CLEARING (Clearing Specific Table) =====
  - tableName: CLEARING
    order: 5
    type: clearing
    parentIdField: TRAN_ID
    mandatory:
      - TRAN_ID
    mapping:
      TRAN_ID: $.transactionId
      CLRST: $.status
      CLRNG_DT: $.clearingDate
      SWT_DT: $.switchDate
