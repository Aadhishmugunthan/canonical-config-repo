eventName: REFUND
description: Refund Service transactions

tables:

  # ===== TABLE 1: SEND_TRANSACTIONS =====
  - tableName: SEND_TRANSACTIONS
    order: 1
    type: main

    mandatory:
      - TRAN_ID
      - TRAN_TYPE

    mapping:

      TRAN_ID: $.refundTransactionId
      TRAN_TYPE: $.transactionType

      TRAN_INIT_ID: $.originalTransactionId

      ORIG_INST_ID: $.partnerId
      ORIG_INST_NAM: $.partnerName

      TRANFR_ACPT_NAM: $.institution
      TRANFR_ACPT_ID: $.partnerId

      TRAN_CRTE_DT: $.refundDate

      CUR_STAT: $.refundStatus.responseReasonCode
      ORIG_STAT: $.refundStatus.eligible

      CUST_REF_NUM: $.referenceId
      USE_CASE: $.refundMethod
      MSG_TYPE: $.network
      REF_ID: $.referenceId

      SW_SER_NUM: $.switchSerialNumber
      BNKINT_REF_NUM: $.correlationId

      SEND_ACCT: $.debtorAccountUri
      RECIP_ACCT: $.creditorAccountUri

      TRAN_AMT: $.refundAmount.value
      TRAN_CURR: $.refundAmount.currency

      ERR_CD: $.refundStatus.responseReasonCode
      ERR_CD_DESC: $.refundStatus.responseReasonDetail

      FUND_AVAIL: $.refundStatus.eligible

      CORLTN_ID: $.correlationId

      CRTE_TS: $.refundDate
      CRTE_USER_NAM: $.partnerName
      UPDT_TS: $.refundDate
      UPDT_USER_NAM: $.partnerName
      RPLCTN_UPDT_TS: $.refundDate

      NTWRK_CD: $.network
      NTWRK_RESP_CD: $.brand
      NTWRK_RESP_CD_DESC: $.acceptanceBrand

      TRAN_INIT_NAM: $.partnerName

      NAM_STAT: $.refundStatus.eligible
      CVC_STAT: $.refundStatus.eligible
      CVC_RESP_CD: $.refundStatus.responseReasonCode

      ACCT_NUM: $.debtorAccountUri
      ACCT_TYPE: $.refundMethod
      ACCT_HOLD_NAM: $.institution

      NON_FIN_TXN: $.transactionType


  # ===== TABLE 2: SEND_TRAN_DTL =====
  - tableName: SEND_TRAN_DTL
    order: 2
    type: detail
    parentIdField: TRAN_ID

    mandatory:
      - TRAN_ID

    mapping:

      TRAN_ID: $.refundTransactionId
      TRAN_CRTE_DT: $.refundDate

      PAYMT_REF: $.referenceId
      UNQ_TRAN_REF: $.correlationId

      FUND_SRC: $.partnerName
      TRAN_PRPS: $.refundReason

      ORIG_RQST_PYLD: $.originalRequestPayload
      ORIG_RESP_PYLD: $.originalResponsePayload

      PROC_ID: $.partnerId

      ACQ_ICA: $.acquiringICA
      ACQ_IDEN_CD: $.acquiringIdentificationCode
      ACQ_CNTRY_NAM: $.country

      PAYMT_TYPE: $.transactionType
      POINT_SERV_INTRCTN: $.network

      TRAN_SETL_AMT: $.refundAmount.value

      BNC_GTWY_RQST: $.originalRequestPayload
      BNC_GTWY_RESP: $.originalResponsePayload

      TRANFR_ACPT_ID: $.partnerId
      TRANFR_ACPT_NAM: $.institution

      TRANFR_ACPT_MPG_ID: $.partnerId
      TRANFR_ACPT_MERCH_VALUE: $.institution

      CRDTYCD: $.refundMethod
      POSPERAT: $.network
      CRDTYCDDES: $.refundMethod

      ICHG_RATE_DSGN: $.brand
      MERCH_CAT_CD: $.transactionType

      MC_ASSGN_MERCH: $.institution
      PAYMT_FACILTR_ID: $.partnerId
      SUB_MERCH_ID: $.partnerId

      TRANFR_TRML_ID: $.partnerId

      TRANFR_ACPT_ST_LINE1: $.institution
      TRANFR_ACPT_ST_LINE2: $.institution

      TRANFR_ACPT_CITY: $.country
      TRANFR_ACPT_ST: $.country
      TRANFR_ACPT_CNTRY_NAM: $.country
      TRANFR_ACPT_POST_CD: $.refundAmount.currency

      CRTE_TS: $.refundDate
      CRTE_USER_NAM: $.partnerName
      UPDT_TS: $.refundDate
      UPDT_USER_NAM: $.partnerName

      EVENT_ID: $.correlationId
      EVENT_TS: $.refundDate
      EVENT_CORLTN_ID: $.correlationId

      MSG_VERSION: $.network

      TRAN_TYPE_IND_CD: $.transactionType
      REGULATED_RATE_TYPE_CD: $.brand

      CVC_RESP_DESC: $.refundStatus.responseReasonDetail

      RPLCTN_UPDT_TS: $.refundDate


  # ===== TABLE 3: SEND_RECIP_DTL =====
  - tableName: SEND_RECIP_DTL
    order: 3
    type: recipient
    parentIdField: TRAN_ID
    autoGenerateId: true

    mandatory:
      - TRAN_ID

    mapping:

      TRAN_ID: $.refundTransactionId
      TRAN_CRTE_DT: $.refundDate

      SEND_FIRST_NAM: $.debtor.firstName
      SEND_MID_NAM: $.debtor.middleName
      SEND_LST_NAM: $.debtor.lastName

      SEND_PHN: $.debtor.phone
      SEND_EMAIL: $.debtor.email
      SEND_DOB: $.debtor.dateOfBirth
      SEND_NATL: $.debtor.address.country

      SEND_ACCT_NUM: $.debtorAccountUri
      SEND_ACCT_URI: $.debtorAccountUri
      SEND_GOVT_ID_URI: $.govtId
      SEND_ACCT_NUM_TYPE: $.refundMethod

      SEND_CARD_NUM: $.debtorAccountUri
      SEND_CARD_EXPIR_DT: $.cardExpiry

      SEND_ST_LINE1: $.debtor.address.line1
      SEND_ST_LINE2: $.debtor.address.line2
      SEND_CITY: $.debtor.address.city
      SEND_ST: $.debtor.address.state
      SEND_CNTRY_NAM: $.debtor.address.country
      SEND_POST_CD: $.debtor.address.postalCode

      RECIP_FIRST_NAM: $.creditor.firstName
      RECIP_MID_NAM: $.creditor.middleName
      RECIP_LST_NAM: $.creditor.lastName

      RECIP_PHN: $.creditor.phone
      RECIP_EMAIL: $.creditor.email
      RECIP_DOB: $.creditor.dateOfBirth
      RECIP_NATL: $.creditor.address.country

      RECIP_ACCT_NUM: $.creditorAccountUri
      RECIP_ACCT_URI: $.creditorAccountUri
      RECIP_GOVT_ID_URI: $.govtId
      RECIP_ACCT_NUM_TYPE: $.refundMethod

      RECIP_CARD_NUM: $.creditorAccountUri
      RECIP_CARD_EXPIR_DT: $.cardExpiry

      RECIP_ST_LINE1: $.creditor.address.line1
      RECIP_ST_LINE2: $.creditor.address.line2
      RECIP_CITY: $.creditor.address.city
      RECIP_ST: $.creditor.address.state
      RECIP_CNTRY_NAM: $.creditor.address.country
      RECIP_POST_CD: $.creditor.address.postalCode

      CRTE_TS: $.refundDate
      CRTE_USER_NAM: $.partnerName
      UPDT_TS: $.refundDate
      UPDT_USER_NAM: $.partnerName
      RPLCTN_UPDT_TS: $.refundDate

      PARTY_ROLE: $.transactionType


  # ===== TABLE 4: SEND_TRAN_ADDR_DTL =====
  - tableName: SEND_TRAN_ADDR_DTL
    order: 4
    type: address
    parentIdField: TRAN_ID
    autoGenerateId: true

    addressTypes:

      - type: INSTITUTION
        rootPath: $
        fields:

          TRAN_ID: $.refundTransactionId

          ST_LINE1: $.institution
          ST_LINE2: $.institution

          CITY: $.country
          ST: $.country
          CNTRY_NAM: $.country

          POST_CD: $.refundAmount.currency

          ADDR_STAT: $.refundStatus.eligible
          POST_CD_STAT: $.refundMethod

          CRTE_TS: $.refundDate
          UPDT_TS: $.refundDate

          CRTE_USER_NAM: $.partnerName
          UPDT_USER_NAM: $.partnerName

          RPLCTN_UPDT_TS: $.refundDate


      - type: DEBTOR
        rootPath: $
        fields:

          TRAN_ID: $.refundTransactionId

          ST_LINE1: $.debtor.address.line1
          ST_LINE2: $.debtor.address.line2

          CITY: $.debtor.address.city
          ST: $.debtor.address.state
          CNTRY_NAM: $.debtor.address.country

          POST_CD: $.debtor.address.postalCode

          ADDR_STAT: $.refundStatus.eligible
          POST_CD_STAT: $.refundMethod

          CRTE_TS: $.refundDate
          UPDT_TS: $.refundDate

          CRTE_USER_NAM: $.partnerName
          UPDT_USER_NAM: $.partnerName

          RPLCTN_UPDT_TS: $.refundDate


      - type: CREDITOR
        rootPath: $
        fields:

          TRAN_ID: $.refundTransactionId

          ST_LINE1: $.creditor.address.line1
          ST_LINE2: $.creditor.address.line2

          CITY: $.creditor.address.city
          ST: $.creditor.address.state
          CNTRY_NAM: $.creditor.address.country

          POST_CD: $.creditor.address.postalCode

          ADDR_STAT: $.refundStatus.responseReasonCode
          POST_CD_STAT: $.refundMethod

          CRTE_TS: $.refundDate
          UPDT_TS: $.refundDate

          CRTE_USER_NAM: $.partnerName
          UPDT_USER_NAM: $.partnerName

          RPLCTN_UPDT_TS: $.refundDate


  # ===== TABLE 5: CLEARING =====
  - tableName: CLEARING
    order: 5
    type: child
    parentIdField: TRAN_ID
    rootPath: $

    mandatory:
      - TRAN_ID

    mapping:

      TRAN_ID: $.refundTransactionId

      CLRST: $.status
      CLRNG_DT: $.clearingDate
      SWT_DT: $.switchDate
