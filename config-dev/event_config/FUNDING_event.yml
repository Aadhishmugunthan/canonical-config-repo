eventName: FUNDING
description: Funding Service transactions

tables:

  # ===== TABLE 1: SEND_TRANSACTIONS (Main Table) =====
  - tableName: SEND_TRANSACTIONS
    order: 1
    type: main
    mandatory:
      - TRAN_ID
      - TRAN_TYPE
    mapping:
      TRAN_ID: $.fundingTransactionId
      TRAN_TYPE: $.transactionType

      TRAN_INIT_ID: $.referenceId

      ORIG_INST_ID: $.partnerId
      ORIG_INST_NAM: $.partnerName

      TRANFR_ACPT_NAM: $.institution
      TRANFR_ACPT_ID: $.partnerId

      TRAN_CRTE_DT: $.transactionLocalDateTime

      CUR_STAT: $.fundingStatus.responseReasonCode
      ORIG_STAT: $.fundingStatus.eligible

      CUST_REF_NUM: $.referenceId
      USE_CASE: $.fundingMethod
      MSG_TYPE: $.network
      REF_ID: $.referenceId

      SW_SER_NUM: $.switchSerialNumber
      BNKINT_REF_NUM: $.correlationId

      SEND_ACCT: $.sourceAccountUri
      RECIP_ACCT: $.destinationAccountUri

      TRAN_AMT: $.fundingAmount.value
      TRAN_CURR: $.fundingAmount.currency

      ERR_CD: $.fundingStatus.responseReasonCode
      ERR_CD_DESC: $.fundingStatus.responseReasonDetail

      FUND_AVAIL: $.fundingStatus.eligible

      CORLTN_ID: $.correlationId

      CRTE_TS: $.transactionLocalDateTime
      CRTE_USER_NAM: $.partnerName
      UPDT_TS: $.transactionLocalDateTime
      UPDT_USER_NAM: $.partnerName
      RPLCTN_UPDT_TS: $.transactionLocalDateTime

      NTWRK_CD: $.network
      NTWRK_RESP_CD: $.brand
      NTWRK_RESP_CD_DESC: $.acceptanceBrand

      TRAN_INIT_NAM: $.partnerName

      NAM_STAT: $.fundingStatus.eligible
      CVC_STAT: $.fundingStatus.eligible
      CVC_RESP_CD: $.fundingStatus.responseReasonCode

      ACCT_NUM: $.sourceAccountUri
      ACCT_TYPE: $.fundingMethod
      ACCT_HOLD_NAM: $.institution

      NON_FIN_TXN: $.transactionType

  # ===== TABLE 2: SEND_TRAN_DTL (Detail Table) =====
  - tableName: SEND_TRAN_DTL
    order: 2
    type: detail
    parentIdField: TRAN_ID
    mandatory:
      - TRAN_ID
    mapping:
      TRAN_ID: $.fundingTransactionId
      TRAN_CRTE_DT: $.transactionLocalDateTime

      PAYMT_REF: $.referenceId
      UNQ_TRAN_REF: $.correlationId

      FUND_SRC: $.partnerName
      TRAN_PRPS: $.fundingPurpose

      ORIG_RQST_PYLD: $.originalRequestPayload
      ORIG_RESP_PYLD: $.originalResponsePayload

      PROC_ID: $.partnerId

      ACQ_ICA: $.brand
      ACQ_IDEN_CD: $.acceptanceBrand
      ACQ_CNTRY_NAM: $.country

      PAYMT_TYPE: $.transactionType
      POINT_SERV_INTRCTN: $.network

      TRAN_SETL_AMT: $.fundingAmount.value

      BNC_GTWY_RQST: $.originalRequestPayload
      BNC_GTWY_RESP: $.originalResponsePayload

      TRANFR_ACPT_ID: $.partnerId
      TRANFR_ACPT_NAM: $.institution

      TRANFR_ACPT_MPG_ID: $.partnerId
      TRANFR_ACPT_MERCH_VALUE: $.institution

      CRDTYCD: $.fundingMethod
      POSPERAT: $.network
      CRDTYCDDES: $.fundingMethod

      ICHG_RATE_DSGN: $.brand
      MERCH_CAT_CD: $.transactionType

      MC_ASSGN_MERCH: $.institution
      PAYMT_FACILTR_ID: $.partnerId
      SUB_MERCH_ID: $.partnerId

      TRANFR_TRML_ID: $.partnerId

      TRANFR_ACPT_ST_LINE1: $.institution
      TRANFR_ACPT_ST_LINE2: $.institution

      TRANFR_ACPT_CITY: $.country
      TRANFR_ACPT_ST: $.country
      TRANFR_ACPT_CNTRY_NAM: $.country
      TRANFR_ACPT_POST_CD: $.fundingAmount.currency

      CRTE_TS: $.transactionLocalDateTime
      CRTE_USER_NAM: $.partnerName
      UPDT_TS: $.transactionLocalDateTime
      UPDT_USER_NAM: $.partnerName

      EVENT_ID: $.correlationId
      EVENT_TS: $.transactionLocalDateTime
      EVENT_CORLTN_ID: $.correlationId

      MSG_VERSION: $.network

      TRAN_TYPE_IND_CD: $.transactionType
      REGULATED_RATE_TYPE_CD: $.brand

      CVC_RESP_DESC: $.fundingStatus.responseReasonDetail

      RPLCTN_UPDT_TS: $.transactionLocalDateTime

  # ===== TABLE 3: SEND_RECIP_DTL (Recipient Table) =====
  - tableName: SEND_RECIP_DTL
    order: 3
    type: recipient
    parentIdField: TRAN_ID
    autoGenerateId: true
    mandatory:
      - TRAN_ID
    mapping:
      TRAN_ID: $.fundingTransactionId
      TRAN_CRTE_DT: $.transactionLocalDateTime

      SEND_FIRST_NAM: $.source.firstName
      SEND_MID_NAM: $.source.firstName
      SEND_LST_NAM: $.source.lastName

      SEND_PHN: $.source.phone
      SEND_EMAIL: $.source.email
      SEND_DOB: $.source.dateOfBirth
      SEND_NATL: $.source.address.country
      SEND_BIRTH_CNTRY_NAM: $.source.address.country

      SEND_ACCT_NUM: $.sourceAccountUri
      SEND_ACCT_URI: $.sourceAccountUri
      SEND_GOVT_ID_URI: $.sourceAccountUri
      SEND_ACCT_NUM_TYPE: $.fundingMethod

      SEND_CARD_NUM: $.sourceAccountUri
      SEND_CARD_EXPIR_DT: $.cardExpiry

      SEND_ST_LINE1: $.source.address.line1
      SEND_ST_LINE2: $.source.address.line2
      SEND_CITY: $.source.address.city
      SEND_ST: $.source.address.state
      SEND_CNTRY_NAM: $.source.address.country
      SEND_POST_CD: $.source.address.postalCode

      RECIP_FIRST_NAM: $.destination.firstName
      RECIP_MID_NAM: $.destination.firstName
      RECIP_LST_NAM: $.destination.lastName

      RECIP_PHN: $.destination.phone
      RECIP_EMAIL: $.destination.email
      RECIP_DOB: $.destination.dateOfBirth
      RECIP_NATL: $.destination.address.country
      RECIP_BIRTH_CNTRY_NAM: $.destination.address.country

      RECIP_ACCT_NUM: $.destinationAccountUri
      RECIP_ACCT_URI: $.destinationAccountUri
      RECIP_GOVT_ID_URI: $.destinationAccountUri
      RECIP_ACCT_NUM_TYPE: $.fundingMethod

      RECIP_CARD_NUM: $.destinationAccountUri
      RECIP_CARD_EXPIR_DT: $.cardExpiry

      RECIP_ST_LINE1: $.destination.address.line1
      RECIP_ST_LINE2: $.destination.address.line2
      RECIP_CITY: $.destination.address.city
      RECIP_ST: $.destination.address.state
      RECIP_CNTRY_NAM: $.destination.address.country
      RECIP_POST_CD: $.destination.address.postalCode

      CRTE_TS: $.transactionLocalDateTime
      CRTE_USER_NAM: $.partnerName
      UPDT_TS: $.transactionLocalDateTime
      UPDT_USER_NAM: $.partnerName
      RPLCTN_UPDT_TS: $.transactionLocalDateTime

      PARTY_ROLE: $.transactionType

  # ===== TABLE 4: SEND_TRAN_ADDR_DTL (Address Table) =====
  - tableName: SEND_TRAN_ADDR_DTL
    order: 4
    type: address
    parentIdField: TRAN_ID
    autoGenerateId: true
    addressTypes:

      - type: INSTITUTION
        rootPath: $
        fields:
          TRAN_ID: $.fundingTransactionId
          ST_LINE1: $.institution
          ST_LINE2: $.institution
          CITY: $.country
          ST: $.country
          CNTRY_NAM: $.country
          POST_CD: $.fundingAmount.currency
          ADDR_STAT: $.fundingMethod
          POST_CD_STAT: $.fundingMethod
          CRTE_TS: $.transactionLocalDateTime
          UPDT_TS: $.transactionLocalDateTime
          CRTE_USER_NAM: $.partnerName
          UPDT_USER_NAM: $.partnerName
          RPLCTN_UPDT_TS: $.transactionLocalDateTime

      - type: SOURCE
        rootPath: $
        fields:
          TRAN_ID: $.fundingTransactionId
          ST_LINE1: $.source.address.line1
          ST_LINE2: $.source.address.line2
          CITY: $.source.address.city
          ST: $.source.address.state
          CNTRY_NAM: $.source.address.country
          POST_CD: $.source.address.postalCode
          ADDR_STAT: $.fundingStatus.eligible
          POST_CD_STAT: $.fundingMethod
          CRTE_TS: $.transactionLocalDateTime
          UPDT_TS: $.transactionLocalDateTime
          CRTE_USER_NAM: $.partnerName
          UPDT_USER_NAM: $.partnerName
          RPLCTN_UPDT_TS: $.transactionLocalDateTime

      - type: DESTINATION
        rootPath: $
        fields:
          TRAN_ID: $.fundingTransactionId
          ST_LINE1: $.destination.address.line1
          ST_LINE2: $.destination.address.line2
          CITY: $.destination.address.city
          ST: $.destination.address.state
          CNTRY_NAM: $.destination.address.country
          POST_CD: $.destination.address.postalCode
          ADDR_STAT: $.fundingStatus.responseReasonCode
          POST_CD_STAT: $.fundingMethod
          CRTE_TS: $.transactionLocalDateTime
          UPDT_TS: $.transactionLocalDateTime
          CRTE_USER_NAM: $.partnerName
          UPDT_USER_NAM: $.partnerName
          RPLCTN_UPDT_TS: $.transactionLocalDateTime
